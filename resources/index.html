<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recursos de Didactika</title>
    <meta name="description" content="Todos los sitios, repositorios y servicios de Didactika: documentación, sistema de diseño, plugins de Moodle, paquetes npm y código abierto." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="canonical" href="https://didactika.org/resources/" />
    <link rel="alternate" hreflang="es" href="https://didactika.org/resources/" />
    <link rel="alternate" hreflang="en" href="https://didactika.org/en/resources/" />
    <link rel="alternate" hreflang="x-default" href="https://didactika.org/en/resources/" />
    <script>
      // The default language lives at the root. A visitor who has not chosen a language is sent to the one their browser asks for, among the
      // alternates of this page; one who has chosen (the cookie "lang", which the language menu sets) is sent to that one. This is what the
      // server did before the site was served by GitHub Pages, which cannot redirect.
      (function () {
        var here = document.documentElement.lang;
        var links = {};
        document.querySelectorAll('link[rel="alternate"][hreflang]').forEach(function (link) { links[link.hreflang] = new URL(link.href).pathname; });
        if (location.pathname !== links[here]) { return; }
        var chosen = (document.cookie.match(/(?:^|; )lang=([^;]+)/) || [])[1];
        var want = links[chosen] ? chosen : '';
        if (!want) {
          var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
          for (var i = 0; i < prefs.length && !want; i++) {
            var code = String(prefs[i]).toLowerCase().split('-')[0];
            if (links[code]) { want = code; }
          }
          // Whoever reads Spanish, Catalan, Galician or Basque stays in the default language; anybody else gets English.
          if (!want) { want = /^(es|ca|gl|eu)$/.test(String(prefs[0] || '').toLowerCase().split('-')[0]) ? here : 'en'; }
        }
        if (want !== here && links[want]) { location.replace(links[want] + location.search + location.hash); }
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:title" content="Recursos de Didactika" />
    <meta property="og:description" content="Todos los sitios, repositorios y servicios de Didactika: documentación, sistema de diseño, plugins de Moodle, paquetes npm y código abierto." />
    <meta property="og:image" content="https://didactika.org/og-image.png" />
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('didactika-theme'); } catch (error) { /* no storage */ }
        if (theme !== 'light' && theme !== 'dark') { theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/resources-main.tsx"></script>
  </body>
</html>
